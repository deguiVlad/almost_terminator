name: arm_ik tests

on:
  push:
    paths:
      - "arm_ik/**"
      - ".github/workflows/arm_ik_tests.yml"
  pull_request:
    paths:
      - "arm_ik/**"
      - ".github/workflows/arm_ik_tests.yml"

jobs:
  python-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy scipy pytest
      - name: Compile Python sources
        run: python -m compileall -q arm_ik/arm_ik arm_ik/bin arm_ik/launch
      - name: Run normal offline tests
        working-directory: arm_ik
        run: python -m pytest test -q
      - name: Run core tests without NumPy or SciPy
        working-directory: arm_ik
        env:
          ARM_IK_FORCE_PURE: "1"
        run: python -m pytest test/test_kinematics.py test/test_urdf_model.py -q
