# focus_tracking — параметры по умолчанию (загружается launch-файлом)
focus_controller_node:
  ros__parameters:
    source: object          # object | hand | both
    publish_rate_hz: 20.0
    yaw_limit: 1.5          # рад; физический предел head_yaw [-1.57, 1.57]
    pitch_limit: 0.44       # рад; физический предел head_pitch [-0.44, 0.44]
    deadzone_px: 20.0       # не дёргаемся, если ошибка цели < 20 px
    smoothing: 0.5          # LPF: tgt = a*new + (1-a)*old
    target_timeout_s: 1.0   # цель потеряна -> нейтраль
    weight_object: 1.0      # режим both: вес цели-объекта
    weight_hand: 0.3        # режим both: вес цели-руки
    hand_offset_px_x: 150.0 # руку держим в нижнем правом квадранте кадра
    hand_offset_px_y: 100.0

hand_tracker_node:
  ros__parameters:
    camera_frame: camera_head_link
    hand: right             # left | right (переключается сервисом /focus/set_hand)
    rate_hz: 50.0
    z_near: 0.15

object_detector_node:
  ros__parameters:
    # Именованные HSV-окна (плоский список: name,h_lo,s_lo,v_lo,h_hi,s_hi,v_hi ...).
    # Красный тон огибает 0: h_lo=170 > h_hi=10 — детектор сам склеивает два диапазона.
    colors: ["red", 170.0, 100.0, 80.0, 10.0, 255.0, 255.0,
             "green", 40.0, 80.0, 60.0, 85.0, 255.0, 255.0,
             "blue", 95.0, 80.0, 60.0, 130.0, 255.0, 255.0,
             "yellow", 20.0, 80.0, 80.0, 38.0, 255.0, 255.0]
    min_area: 300.0
    depth_window: 9
    max_range_m: 5.5
    auto_select: true       # false — цель публикуется только по сервису /focus/detect
    # Sticky ID: id присваивается в порядке обнаружения и закрепляется за объектом.
    match_radius_m: 0.15  # порог сопоставления blob с существующим id, м
    ttl_s: 5.0            # держать id без обнаружения, с (номера не переиспользуются)
